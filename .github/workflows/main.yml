name: CI/CD — Build Artifact + Update Helm

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build & Save Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Test backend
        run: |
          cd app
          pip install -r requirements.txt
          pip install pytest httpx
          pytest tests/ -v

      - name: Build backend image
        run: |
          docker build \
            -t gitops-demo-backend:${{ steps.tag.outputs.sha }} \
            ./app

      - name: Build frontend image
        run: |
          docker build \
            -t gitops-demo-frontend:${{ steps.tag.outputs.sha }} \
            ./frontend

      - name: Save images as tar
        run: |
          mkdir -p artifacts
          docker save gitops-demo-backend:${{ steps.tag.outputs.sha }} \
            | gzip > artifacts/backend.tar.gz
          docker save gitops-demo-frontend:${{ steps.tag.outputs.sha }} \
            | gzip > artifacts/frontend.tar.gz
          echo "${{ steps.tag.outputs.sha }}" > artifacts/image_tag.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ steps.tag.outputs.sha }}
          path: artifacts/
          retention-days: 7

  cd:
    name: Update Helm values.yaml
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update image tag in values.yaml
        run: |
          sed -i "s|tag:.*|tag: \"${{ needs.ci.outputs.image_tag }}\"|g" \
            helm/gitops-demo/values.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-demo/values.yaml
          git diff --staged --quiet || \
            git commit -m "chore: update image tag to ${{ needs.ci.outputs.image_tag }} [skip ci]"
          git push origin main