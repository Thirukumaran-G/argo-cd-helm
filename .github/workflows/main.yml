name: CI/CD — Build, Push GHCR, Update Helm

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/thirukumaran-g/argo-cd-helm-backend
  FRONTEND_IMAGE: ghcr.io/thirukumaran-g/argo-cd-helm-frontend

jobs:
  ci:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  cd:
    name: Update Helm values.yaml
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest before update
        run: git pull origin main

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tags in values.yaml
        run: |
          yq e ".backend.image.tag = \"${{ needs.ci.outputs.image_tag }}\"" \
            -i helm/gitops-demo/values.yaml
          yq e ".frontend.image.tag = \"${{ needs.ci.outputs.image_tag }}\"" \
            -i helm/gitops-demo/values.yaml
          echo "=== Updated values.yaml ==="
          cat helm/gitops-demo/values.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-demo/values.yaml
          git diff --staged --quiet || \
            git commit -m "chore: update image tag to ${{ needs.ci.outputs.image_tag }} [skip ci]"
          git push origin main